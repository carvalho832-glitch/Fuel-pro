# Não há cron nem escrita em dados.json. Reativação somente após
# validação das fontes, revisão de segurança e aprovação de publicação.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar bloqueio de publicações automáticas antigas
        run: |
          echo "Fluxo antigo DESATIVADO: dados.json não é atualizado por scraper legado."
          echo "Consultar o motor ANP de staging para preços reais datados."
