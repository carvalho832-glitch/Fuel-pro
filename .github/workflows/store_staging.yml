name: Fuel Pro - Guardar histórico ANP na branch de testes

on:
  workflow_dispatch:
  push:
    branches: [dev/fuelpro-confianca-anp]
    paths:
      - engine_anp.py
      - anp_history.py
      - fuel_confidence.py
      - .github/workflows/store_staging.yml

permissions:
  contents: write

concurrency:
  group: fuelpro-anp-staging
  cancel-in-progress: false

jobs:
  salvar-coletas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar branch de testes
        uses: actions/checkout@v4
        with:
          ref: dev/fuelpro-confianca-anp
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas
        run: python -m pip install requests beautifulsoup4 openpyxl
      - name: Importar preços, localizações e histórico existente
        run: python engine_anp.py --prev data/historico_anp.json --out-dir staging --history-weeks 6
      - name: Conferir critérios de integridade
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("staging/status.json").read_text())
          v = json.loads(Path("staging/dados_candidatos.json").read_text())
          catalog = json.loads(Path("staging/catalogo_postos_anp.json").read_text())
          assert len(catalog) == s["catalogStations"], "Catálogo inconsistente"
          assert all(x["fuelScore"]["overallScore"] is None for x in catalog), "Reputação não pode ser inventada"
          assert all(x.get("priceStatus") != "not_available" or x.get("prices") == {} for x in catalog), "Preço inventado em posto sem dados"
          assert s["hasStagingCandidates"] and len(v) > 0, "Nenhum candidato válido, não salvar"
          assert s["publicationApproved"] is False, "Staging não pode liberar publicação"
          assert all(x.get("source") == "ANP - levantamento semanal" for x in v)
          assert all(x.get("geoSource") == "ANP - API Revendedores" for x in v)
          assert all(x.get("collectedAtByFuel") for x in v)
          print("Registros de staging aceitos:", len(v))
          PY
      - name: Armazenar somente na branch de testes, sem publicar PWA
        run: |
          mkdir -p data
          cp staging/historico_anp.json data/historico_anp.json
          cp staging/dados_candidatos.json data/postos_anp_candidatos.json
          cp staging/status.json data/engine_status.json
          cp staging/catalogo_postos_anp.json data/catalogo_postos_anp.json
          git config user.name 'fuelpro-engine[bot]'
          git config user.email 'fuelpro-engine@users.noreply.github.com'
          git add data/historico_anp.json data/postos_anp_candidatos.json data/engine_status.json data/catalogo_postos_anp.json
          git diff --cached --quiet && echo 'Sem mudanças na base.' && exit 0
          git commit -m "data: atualizar coletas ANP em staging (sem publicação)"
          if ! git push origin HEAD:dev/fuelpro-confianca-anp; then
            echo "Branch avançou: tentar rebase seguro, sem force push."
            git fetch origin dev/fuelpro-confianca-anp
            git rebase origin/dev/fuelpro-confianca-anp
            git push origin HEAD:dev/fuelpro-confianca-anp
          fi
